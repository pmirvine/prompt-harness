[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptharness"
version = "0.1.0"
description = "Prompt regression testing TUI"
requires-python = ">=3.11"
dependencies = [
    "textual>=8",
    "rich>=15",
    "openai>=3",
    "jinja2>=3.1",
    "pydantic>=2",
    "typer>=0.27",
    "pyyaml>=6",
    "jsonschema>=4",
    "platformdirs>=4",
]

[project.scripts]
promptharness = "promptharness.cli:app"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
